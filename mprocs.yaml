procs:
  client:
    cwd: packages/client
    shell: pnpm run dev
  contracts:
    cwd: packages/contracts
    shell: pnpm mud dev-contracts --rpc http://127.0.0.1:8545
  anvil:
    cwd: packages/contracts
    shell: anvil --base-fee 0 --block-time 2
  explorer:
    # Binary from root dep @latticexyz/explorer.
    # Wrapper applies Node 24 Sentry shim + sqlite sync patches (see scripts/run-explorer.sh).
    cwd: .
    shell: bash scripts/run-explorer.sh
